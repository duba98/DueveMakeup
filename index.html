<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueveMakeup | Maquillaje y Belleza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DueveMakeup</h1>
        <p>Resalta tu belleza única</p>
    </header>

    <main>
        <section class="hero">
            <h2>Próximamente Nuestra Tienda Oficial</h2>
            <p>Descubre nuestros productos de maquillaje y cuidado personal.</p>
            <button onclick="alert('¡Gracias por visitar DueveMakeup!')">Saber más</button>
        </section>
    </main>
<section class="productos">
    <h2>Nuestros Productos Destacados</h2>
    
    <div class="grid-productos">
        <!-- ATENEA -->
        <article class="tarjeta-producto">
            <img src="https://via.placeholder.com/200" alt="Labial Matte">
            <h3>Labial Matte Rose</h3>
            <p class="precio">$15.000</p>
            <button class="btn-comprar">Añadir al carrito</button>
        </article>

        <!-- BLOOMSHELL -->
        <article class="tarjeta-producto">
            <img src="https://via.placeholder.com/200" alt="Base de Maquillaje">
            <h3>Base Liquida Glow</h3>
            <p class="precio">$25.000</p>
            <button class="btn-comprar">Añadir al carrito</button>
        </article>
    </div>
</section>


    <footer>
        <p>&copy; 2026 DueveMakeup - Todos los derechos reservados</p>
    </footer>
</body>
</html>
